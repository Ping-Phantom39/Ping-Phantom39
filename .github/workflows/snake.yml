```yaml
name: Generate Cyberpunk Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Create Assets Directory
        run: mkdir -p assets

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            assets/github-snake.svg?color_snake=%237C3AED&color_dots=%23EBEDF0,%23BAE6FD,%2367E8F9,%2322D3EE,%2300FFE0
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%23FF1493&color_dots=%23020617,%2331265C,%235B21B6,%230899B2,%2300FFE0

      - name: Commit Snake Animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update contribution snake"
            git push
          fi
```
